<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>特別費の積立</title>
<style>
  :root{
    --bg:#f5f5f3;
    --card:#ffffff;
    --border:#e2e0db;
    --text:#2b2b28;
    --sub:#8a8680;
    --main:#5b7fa0;
    --main-light:#e9eff5;
    --accent2:#c99a3e;
    --accent2-light:#faf1de;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    max-width:480px;
    margin:0 auto;
    padding-bottom:40px;
  }
  header{
    padding:18px 16px 12px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
    border-bottom:1px solid var(--border);
  }
  h1{ font-size:17px; margin:0 0 2px; font-weight:600; }
  .sub-text{ font-size:12px; color:var(--sub); margin-top:2px; line-height:1.6; }
  .app-nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-top:10px;
    padding-bottom:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .app-nav::-webkit-scrollbar{ display:none; }
  .app-nav a{
    flex-shrink:0;
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    background:#fff;
    border:1px solid var(--border);
    color:var(--sub);
    text-decoration:none;
    white-space:nowrap;
  }
  .app-nav a.active{
    background:var(--text);
    border-color:var(--text);
    color:#fff;
    font-weight:600;
  }

  .section{
    margin:14px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
  }
  .section.total-section{ border-top:3px solid var(--main); }
  .section-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title .count{ font-size:11px; color:var(--sub); font-weight:400; }

  /* --- 項目カード --- */
  .item-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
    background:#fafaf8;
  }
  .item-row-top{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .item-row-top input[type=text]{
    flex:1;
    min-width:0;
    font-size:13px;
    padding:7px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
  }
  .item-row-top .del-btn{
    border:none; background:none; color:var(--sub);
    font-size:17px; line-height:1; padding:2px 2px; cursor:pointer; flex-shrink:0;
  }
  .seg{
    display:flex;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .seg button{
    flex:1;
    border:none;
    background:#fff;
    font-size:11.5px;
    padding:7px 0;
    color:var(--sub);
    cursor:pointer;
  }
  .seg button.active{
    background:var(--text);
    color:#fff;
    font-weight:600;
  }

  .field-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:11.5px;
    color:var(--sub);
  }
  .field-row .field-label{ flex-shrink:0; width:74px; }
  .field-row input[type=number]{
    min-width:0;
    flex:1;
    text-align:right;
    font-size:12px;
    padding:7px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
  }
  .field-row .unit{ flex-shrink:0; font-size:11px; color:var(--sub); }
  .ym-pair{ display:flex; gap:4px; flex:1; }
  .ym-pair input{ flex:1; }

  .item-result{
    margin-top:8px;
    padding:8px 10px;
    border-radius:8px;
    background:var(--main-light);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .item-result .label{ font-size:11px; color:var(--sub); }
  .item-result .value{ font-size:16px; font-weight:700; color:var(--main); }
  .item-result.warn{ background:var(--accent2-light); }
  .item-result.warn .value{ font-size:11.5px; font-weight:600; color:var(--accent2); }

  .add-btn-row{ display:flex; gap:8px; margin-top:4px; }
  .add-item-btn{
    flex:1;
    padding:9px;
    border:1px dashed var(--border);
    border-radius:8px;
    background:none;
    font-size:12.5px;
    color:var(--sub);
  }
  .reload-btn{
    width:100%;
    margin-top:8px;
    padding:8px;
    border:none;
    border-radius:8px;
    background:var(--main-light);
    color:var(--main);
    font-size:12px;
    font-weight:600;
  }
  .empty-note{
    font-size:12px; color:var(--sub); text-align:center; padding:14px 4px;
  }

  /* --- 合計サマリー --- */
  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:4px;
  }
  .summary-box{
    background:#fafaf8;
    border-radius:8px;
    padding:10px 12px;
  }
  .summary-box .label{ font-size:11px; color:var(--sub); margin-bottom:2px; }
  .summary-box .value{ font-size:19px; font-weight:700; color:var(--main); }
  .total-caption{
    font-size:11px; color:var(--sub); text-align:center; margin-bottom:10px;
  }
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:6px 0;
    border-bottom:1px solid #f0efec;
  }
  .breakdown-row:last-child{ border-bottom:none; }
  .breakdown-row .bname{ color:var(--text); }
  .breakdown-row .bval{ color:var(--main); font-weight:600; }

  .tip-box{
    margin-top:10px;
    padding:10px;
    background:var(--accent2-light);
    border-radius:8px;
    font-size:11.5px;
    color:var(--text);
    line-height:1.6;
  }

  .footer-note{
    text-align:center; font-size:11px; color:var(--sub);
    margin:20px 20px 0; line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <h1>特別費の積立</h1>
  <div class="sub-text">車の買い替え・家電の故障・旅行など、毎月は発生しないけれど年間で見ると大きい「特別費」を項目別に洗い出し、毎月いくら積み立てればよいかを計算します</div>
  <nav class="app-nav">
    <a href="index.html">年間収支</a>
    <a href="tokubetsuhi.html" class="active">特別費の積立</a>
    <a href="hiwari-kakeibo.html">残高チェック</a>
    <a href="kazoku-nenpyo.html">家族年表</a>
    <a href="shisan-suii.html">資産推移</a>
  </nav>
</header>

<div class="section">
  <div class="section-title">
    <span>積立項目</span>
    <span class="count" id="itemCount"></span>
  </div>
  <div id="itemList"></div>
  <div class="empty-note" id="emptyNote" style="display:none;">項目がありません。下のボタンから追加してください</div>
  <div class="add-btn-row">
    <button class="add-item-btn" id="addAnnualBtn">＋ 年間見積もり型</button>
    <button class="add-item-btn" id="addTargetBtn">＋ 目標時期あり型</button>
  </div>
</div>

<div class="section total-section">
  <div class="section-title"><span>特別費の積立合計</span></div>
  <div class="summary-grid">
    <div class="summary-box">
      <div class="label">年間の特別費 合計</div>
      <div class="value" id="totalAnnual">¥0</div>
    </div>
    <div class="summary-box">
      <div class="label">毎月の積立額 合計</div>
      <div class="value" id="totalMonthly">¥0</div>
    </div>
  </div>
  <div class="total-caption">毎月、各項目の積立額を先取りしておくのが目安です</div>
  <div id="breakdownList"></div>
  <button class="reload-btn" id="writeToAnnualBtn">年間収支計画表の各項目に積立額を書き込む</button>
  <div class="tip-box">上のボタンを押すと、年間収支計画表の支出項目のうち同じ名前のものに、その項目の毎月の積立額が反映されます(金額・回数(×12)を更新。無ければ新規追加)。</div>
</div>

<div class="footer-note">入力内容は自動的にこの端末に保存されます</div>

<script>
const SOURCE_KEY = 'nenkan-shuushi-keikaku-v2'; // 年間収支計画表(書き込み先として参照)
const SELF_KEY = 'tokubetsuhi-tsumitate-v2';
const OLD_TOKUBETSUHI_KEY = 'tokubetsuhi-tsumitate-v1'; // さらに古い旧版(あれば1回だけ引き継ぐ)
const OLD_FLOWCHART_KEY = 'yosan-kumitate-flowchart-v1'; // 旧・支出を整理する(積立計算オンの項目だけ1回だけ引き継ぐ)

function newId(){
  return 'i' + Date.now() + Math.random().toString(16).slice(2);
}

let state = loadState();
migrateFromOldTools();

function loadState(){
  try{
    const raw = localStorage.getItem(SELF_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.items)) return parsed;
    }
  }catch(e){}
  return { items: [] };
}

function saveState(){
  localStorage.setItem(SELF_KEY, JSON.stringify(state));
}

// 旧ツールに積立データが残っていれば、1回だけこちらに引き継ぐ。
function migrateFromOldTools(){
  if(state.migrated) return;

  try{
    const raw = localStorage.getItem(OLD_TOKUBETSUHI_KEY);
    if(raw){
      const old = JSON.parse(raw);
      if(old && Array.isArray(old.items)){
        old.items.forEach(oi=>{
          const name = (oi.name||'').trim();
          if(!name) return;
          state.items.push({
            id:newId(), name:name, mode: oi.mode||'annual',
            annualAmount: oi.annualAmount||'', targetAmount: oi.targetAmount||'',
            years: oi.years||'', months: oi.months||'', saved: oi.saved||''
          });
        });
      }
    }
  }catch(e){}

  try{
    const raw = localStorage.getItem(OLD_FLOWCHART_KEY);
    if(raw){
      const old = JSON.parse(raw);
      if(old && Array.isArray(old.items)){
        old.items.forEach(oi=>{
          if(oi.regular !== false || !oi.fundEnabled) return;
          const name = (oi.name||'').trim();
          if(!name) return;
          if(state.items.find(it=>(it.name||'').trim()===name)) return;
          state.items.push({
            id:newId(), name:name, mode: oi.fundMode||'annual',
            annualAmount: oi.fundAnnualAmount||'', targetAmount: oi.fundTargetAmount||'',
            years: oi.fundYears||'', months: oi.fundMonths||'', saved: oi.fundSaved||''
          });
        });
      }
    }
  }catch(e){}

  state.migrated = true;
  saveState();
}

function yen(n){
  return '¥' + Math.round(n).toLocaleString('ja-JP');
}
function escapeAttr(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function computeMonthly(item){
  if(item.mode === 'annual'){
    const amt = parseFloat(item.annualAmount)||0;
    return { monthly: amt/12, valid:true };
  }else{
    const totalMonths = (parseInt(item.years)||0)*12 + (parseInt(item.months)||0);
    const remaining = Math.max((parseFloat(item.targetAmount)||0) - (parseFloat(item.saved)||0), 0);
    if(totalMonths <= 0){
      return { monthly:0, valid:false, remaining:remaining };
    }
    return { monthly: remaining/totalMonths, valid:true, totalMonths:totalMonths };
  }
}

function renderItemList(){
  const container = document.getElementById('itemList');
  container.innerHTML = '';
  document.getElementById('emptyNote').style.display = state.items.length ? 'none' : 'block';
  document.getElementById('itemCount').textContent = state.items.length ? state.items.length + '件' : '';

  state.items.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'item-card';

    let fieldsHtml = '';
    if(item.mode === 'annual'){
      fieldsHtml = `
        <div class="field-row">
          <span class="field-label">年間想定額</span>
          <input type="number" inputmode="numeric" class="f-annual" value="${item.annualAmount}" placeholder="例: 30000">
          <span class="unit">円/年</span>
        </div>`;
    }else{
      fieldsHtml = `
        <div class="field-row">
          <span class="field-label">目標金額</span>
          <input type="number" inputmode="numeric" class="f-target" value="${item.targetAmount}" placeholder="例: 2000000">
          <span class="unit">円</span>
        </div>
        <div class="field-row">
          <span class="field-label">あと</span>
          <div class="ym-pair">
            <input type="number" inputmode="numeric" class="f-years" value="${item.years}" placeholder="年">
            <input type="number" inputmode="numeric" class="f-months" value="${item.months}" placeholder="ヶ月">
          </div>
          <span class="unit">後</span>
        </div>
        <div class="field-row">
          <span class="field-label">すでに貯蓄</span>
          <input type="number" inputmode="numeric" class="f-saved" value="${item.saved}" placeholder="0">
          <span class="unit">円</span>
        </div>`;
    }

    card.innerHTML = `
      <div class="item-row-top">
        <input type="text" class="f-name" value="${escapeAttr(item.name)}" placeholder="項目名(例：家電の修理、車の買い替え)" maxlength="16">
        <button class="del-btn">×</button>
      </div>
      <div class="seg mode-seg">
        <button data-val="annual" class="${item.mode==='annual'?'active':''}">年間見積もり</button>
        <button data-val="target" class="${item.mode==='target'?'active':''}">目標時期あり</button>
      </div>
      <div class="fields-wrap">${fieldsHtml}</div>
      <div class="item-result-wrap"></div>`;

    const nameInput = card.querySelector('.f-name');
    const delBtn = card.querySelector('.del-btn');
    const modeBtns = card.querySelectorAll('.mode-seg button');
    const resultWrap = card.querySelector('.item-result-wrap');

    function refreshResult(){
      const r = computeMonthly(item);
      if(r.valid){
        resultWrap.innerHTML = `<div class="item-result"><span class="label">毎月の積立額</span><span class="value">${yen(r.monthly)}</span></div>`;
      }else{
        resultWrap.innerHTML = `<div class="item-result warn"><span class="label">毎月の積立額</span><span class="value">期間を入力してください</span></div>`;
      }
    }

    nameInput.addEventListener('input', e=>{ item.name = e.target.value; saveState(); renderTotals(); });
    delBtn.addEventListener('click', ()=>{ state.items.splice(idx,1); saveState(); render(); });

    modeBtns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(item.mode === btn.dataset.val) return;
        item.mode = btn.dataset.val;
        saveState();
        render();
      });
    });

    function bindNumber(selector, field){
      const el = card.querySelector(selector);
      if(!el) return;
      el.addEventListener('input', e=>{
        item[field] = e.target.value;
        saveState();
        refreshResult();
        renderTotals();
      });
    }
    bindNumber('.f-annual','annualAmount');
    bindNumber('.f-target','targetAmount');
    bindNumber('.f-years','years');
    bindNumber('.f-months','months');
    bindNumber('.f-saved','saved');

    refreshResult();
    container.appendChild(card);
  });
}

let currentFundItems = [];

function renderTotals(){
  let total = 0;
  const rows = [];
  currentFundItems = [];
  state.items.forEach(item=>{
    const r = computeMonthly(item);
    const name = (item.name||'').trim();
    if(r.valid && r.monthly > 0){
      total += r.monthly;
      rows.push({ name: name || '（無題）', monthly:r.monthly });
      if(name) currentFundItems.push({ name, monthly:r.monthly });
    }
  });
  document.getElementById('totalMonthly').textContent = yen(total);
  document.getElementById('totalAnnual').textContent = yen(total*12);
  const list = document.getElementById('breakdownList');
  list.innerHTML = rows.map(r=>`<div class="breakdown-row"><span class="bname">${escapeAttr(r.name)}</span><span class="bval">${yen(r.monthly)}</span></div>`).join('');
}

document.getElementById('addAnnualBtn').addEventListener('click', ()=>{
  state.items.push({ id:newId(), name:'', mode:'annual', annualAmount:'', targetAmount:'', years:'', months:'', saved:'' });
  saveState();
  render();
});
document.getElementById('addTargetBtn').addEventListener('click', ()=>{
  state.items.push({ id:newId(), name:'', mode:'target', annualAmount:'', targetAmount:'', years:'', months:'', saved:'' });
  saveState();
  render();
});

// 年間収支計画表(index.html)の支出項目に、積立計算した各項目の毎月の積立額を項目名ごとに書き込む。
// 同じ名前の支出項目があれば金額・回数(×12)を更新し、無ければ新規追加する。
function writeFundItemsToAnnualBudget(fundItems){
  let budget;
  try{
    const raw = localStorage.getItem(SOURCE_KEY);
    budget = raw ? JSON.parse(raw) : null;
  }catch(e){ budget = null; }
  if(!budget || !Array.isArray(budget.income) || !Array.isArray(budget.expense)){
    budget = { year: new Date().getFullYear(), income: [], expense: [] };
  }

  let added = 0, updated = 0;
  fundItems.forEach(fi=>{
    const amount = Math.round(fi.monthly);
    const existing = budget.expense.find(it => (it.name||'').trim() === fi.name);
    if(existing){
      if(existing.amount !== amount || existing.count !== 12){
        existing.amount = amount;
        existing.count = 12;
        updated++;
      }
    }else{
      budget.expense.push({ name: fi.name, amount: amount, count: 12 });
      added++;
    }
  });

  localStorage.setItem(SOURCE_KEY, JSON.stringify(budget));
  return { added, updated };
}

document.getElementById('writeToAnnualBtn').addEventListener('click', ()=>{
  if(currentFundItems.length === 0){
    alert('積立額が計算できる項目がありません。先に積立項目を入力してください。');
    return;
  }
  const { added, updated } = writeFundItemsToAnnualBudget(currentFundItems);
  const parts = [];
  if(added > 0) parts.push(`新規追加 ${added}件`);
  if(updated > 0) parts.push(`金額を更新 ${updated}件`);
  alert('年間収支計画表に反映しました：' + (parts.length ? parts.join(' / ') : '差分はありませんでした'));
});

function render(){
  renderItemList();
  renderTotals();
}

render();
</script>
</body>
</html>
