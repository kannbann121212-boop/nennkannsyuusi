<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>サブスク管理</title>
<style>
  :root{
    --bg:#f5f5f3;
    --card:#ffffff;
    --border:#e2e0db;
    --text:#2b2b28;
    --sub:#8a8680;
    --main:#3d7a94;
    --main-light:#e5f0f3;
    --warn:#c99a3e;
    --warn-light:#faf1de;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    max-width:480px;
    margin:0 auto;
    padding-bottom:40px;
  }
  header{
    padding:18px 16px 12px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
    border-bottom:1px solid var(--border);
  }
  h1{ font-size:17px; margin:0 0 2px; font-weight:600; }
  .sub-text{ font-size:12px; color:var(--sub); margin-top:2px; line-height:1.6; }
  .app-nav{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-top:10px;
    padding-bottom:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .app-nav::-webkit-scrollbar{ display:none; }
  .app-nav a{
    flex-shrink:0;
    font-size:11px;
    padding:6px 10px;
    border-radius:999px;
    background:#fff;
    border:1px solid var(--border);
    color:var(--sub);
    text-decoration:none;
    white-space:nowrap;
  }
  .app-nav a.active{
    background:var(--text);
    border-color:var(--text);
    color:#fff;
    font-weight:600;
  }

  .section{
    margin:14px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
  }
  .section.main-section{ border-top:3px solid var(--main); }
  .section-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title .count{ font-size:11px; color:var(--sub); font-weight:400; }

  /* --- 項目カード(サブスク) --- */
  .item-card{
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
    background:#fafaf8;
  }
  .item-row-top{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .item-row-top input[type=text]{
    flex:1.3;
    min-width:0;
    font-size:12.5px;
    padding:7px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
  }
  .item-row-top input[type=number]{
    flex:1;
    min-width:0;
    text-align:right;
    font-size:12.5px;
    padding:7px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
  }
  .item-row-top .del-btn{
    border:none; background:none; color:var(--sub);
    font-size:17px; line-height:1; padding:2px 2px; cursor:pointer; flex-shrink:0;
  }
  .seg{
    display:flex;
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .seg button{
    flex:1;
    border:none;
    background:#fff;
    font-size:11.5px;
    padding:7px 0;
    color:var(--sub);
    cursor:pointer;
  }
  .seg button.active{ background:var(--text); color:#fff; font-weight:600; }

  .field-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-size:11.5px;
    color:var(--sub);
  }
  .field-row .field-label{ flex-shrink:0; width:56px; }
  .field-row input[type=number]{
    min-width:0;
    flex:1;
    font-size:12px;
    padding:7px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
  }
  .field-row input[type=number]{ text-align:right; }
  .field-row .unit{ flex-shrink:0; font-size:11px; color:var(--sub); }

  .item-result{
    margin-top:8px;
    padding:8px 10px;
    border-radius:8px;
    background:var(--main-light);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11.5px;
    color:var(--sub);
  }
  .item-result .value{ font-size:13px; font-weight:700; color:var(--main); }

  .add-item-btn{
    width:100%;
    margin-top:6px;
    padding:9px;
    border:1px dashed var(--border);
    border-radius:8px;
    background:none;
    font-size:13px;
    color:var(--sub);
  }
  .empty-note{
    font-size:12px; color:var(--sub); text-align:center; padding:14px 4px;
  }
  .reload-btn{
    width:100%;
    margin-top:10px;
    padding:8px;
    border:none;
    border-radius:8px;
    background:var(--main-light);
    color:var(--main);
    font-size:12px;
    font-weight:600;
  }
  .sync-tip{
    font-size:11px; color:var(--sub); margin-top:8px; line-height:1.6;
  }

  /* --- サマリー --- */
  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .summary-box{ background:#fafaf8; border-radius:8px; padding:10px 12px; }
  .summary-box .label{ font-size:11px; color:var(--sub); margin-bottom:2px; }
  .summary-box .value{ font-size:17px; font-weight:700; color:var(--main); }
  .summary-box.full{ grid-column:1 / -1; }

  .footer-note{
    text-align:center; font-size:11px; color:var(--sub);
    margin:20px 20px 0; line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <h1>サブスク管理</h1>
  <div class="sub-text">定期購読(サブスク)や会員費を一覧管理し、月ごと・年ごとにいくらかかるかを確認できます(どのカードで払うかは「カード管理」で確認できます)</div>
  <nav class="app-nav">
    <a href="index.html">年間収支</a>
    <a href="tokubetsuhi.html">特別費の積立</a>
    <a href="subscription.html" class="active">サブスク管理</a>
    <a href="card.html">カード管理</a>
    <a href="hiwari-kakeibo.html">残高チェック</a>
    <a href="lifeplan.html">ライフプラン</a>
    <a href="kazoku-nenpyo.html">家族年表</a>
  </nav>
</header>

<div class="section main-section">
  <div class="section-title">
    <span>定期支払い(サブスク・会員費)</span>
    <span class="count" id="itemCount"></span>
  </div>
  <div id="itemList"></div>
  <div class="empty-note" id="emptyNote" style="display:none;">項目がありません。下のボタンから追加してください</div>
  <button class="add-item-btn" id="addItemBtn">＋ サブスクを追加</button>
</div>

<div class="section main-section">
  <div class="section-title"><span>全体サマリー</span></div>
  <div class="summary-grid">
    <div class="summary-box"><div class="label">月間合計(概算)</div><div class="value" id="sumMonthly">¥0</div></div>
    <div class="summary-box"><div class="label">年間合計</div><div class="value" id="sumYearly">¥0</div></div>
    <div class="summary-box full"><div class="label">登録件数</div><div class="value" id="sumCount">0件</div></div>
  </div>
  <button class="reload-btn" id="writeToAnnualBtn">年間収支計画表に「サブスク費」として書き込む</button>
  <div class="sync-tip">上のボタンを押すと、年間収支計画表の支出項目に「サブスク費」として月間合計金額(×12回)が登録されます(すでにある場合は金額を更新します)。</div>
</div>

<div class="footer-note">入力内容は自動的にこの端末に保存されます</div>

<script>
const SELF_KEY = 'subscription-v1';
const OLD_SELF_KEY = 'subscription-card-v1'; // 旧・サブスク&カード統合版(あれば1回だけ項目を引き継ぐ。カード情報は引き継がない)
const ANNUAL_KEY = 'nenkan-shuushi-keikaku-v2'; // 年間収支計画表(書き込み先として参照)
const WRITE_ITEM_NAME = 'サブスク費';

let state = loadState();
migrateFromOldTool();

function loadState(){
  try{
    const raw = localStorage.getItem(SELF_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.items)) return parsed;
    }
  }catch(e){}
  return { items: [] };
}
function saveState(){
  localStorage.setItem(SELF_KEY, JSON.stringify(state));
}
function newId(){
  return 'i' + Date.now() + Math.random().toString(16).slice(2);
}

// 旧・サブスク&カード管理(統合版)のデータが残っていれば、1回だけ項目(名前・金額・周期)を引き継ぐ。
// カードの割り当て(cardId)・請求日は引き継がない(カード管理側で別途登録する)。
function migrateFromOldTool(){
  if(state.migrated) return;
  try{
    const raw = localStorage.getItem(OLD_SELF_KEY);
    if(raw){
      const old = JSON.parse(raw);
      if(old && Array.isArray(old.items) && old.items.length){
        old.items.forEach(oi=>{
          state.items.push({
            id:newId(), name:oi.name||'', amount:oi.amount||'', cycle:oi.cycle||'monthly'
          });
        });
      }
    }
  }catch(e){}
  state.migrated = true;
  saveState();
}

function yen(n){
  return '¥' + Math.round(n).toLocaleString('ja-JP');
}
function escapeAttr(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function monthlyEquivalent(item){
  const amt = parseFloat(item.amount)||0;
  return item.cycle === 'yearly' ? amt/12 : amt;
}
function yearlyEquivalent(item){
  const amt = parseFloat(item.amount)||0;
  return item.cycle === 'yearly' ? amt : amt*12;
}

/* ---------- サブスク項目 ---------- */
function renderItemList(){
  const container = document.getElementById('itemList');
  container.innerHTML = '';
  document.getElementById('emptyNote').style.display = state.items.length ? 'none' : 'block';
  document.getElementById('itemCount').textContent = state.items.length ? state.items.length + '件' : '';

  state.items.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'item-card';

    card.innerHTML = `
      <div class="item-row-top">
        <input type="text" class="f-name" value="${escapeAttr(item.name)}" placeholder="サービス名(例: Netflix)" maxlength="16">
        <input type="number" inputmode="numeric" class="f-amount" value="${item.amount}" placeholder="金額">
        <button class="del-btn">×</button>
      </div>
      <div class="seg mode-seg">
        <button data-val="monthly" class="${item.cycle==='monthly'?'active':''}">月次</button>
        <button data-val="yearly" class="${item.cycle==='yearly'?'active':''}">年次</button>
      </div>
      <div class="item-result-wrap"></div>`;

    const nameInput = card.querySelector('.f-name');
    const amountInput = card.querySelector('.f-amount');
    const delBtn = card.querySelector('.del-btn');
    const modeBtns = card.querySelectorAll('.mode-seg button');
    const resultWrap = card.querySelector('.item-result-wrap');

    function refreshResult(){
      resultWrap.innerHTML = `<div class="item-result">
        <span>月換算</span>
        <span class="value">${yen(monthlyEquivalent(item))}</span>
      </div>`;
    }

    nameInput.addEventListener('input', e=>{ item.name = e.target.value; saveState(); });
    amountInput.addEventListener('input', e=>{ item.amount = e.target.value; saveState(); refreshResult(); renderTotals(); });
    delBtn.addEventListener('click', ()=>{ state.items.splice(idx,1); saveState(); render(); });

    modeBtns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(item.cycle === btn.dataset.val) return;
        item.cycle = btn.dataset.val;
        saveState();
        refreshResult();
        renderTotals();
        modeBtns.forEach(b=>b.classList.toggle('active', b===btn));
      });
    });

    refreshResult();
    container.appendChild(card);
  });
}
document.getElementById('addItemBtn').addEventListener('click', ()=>{
  state.items.push({ id:newId(), name:'', amount:'', cycle:'monthly' });
  saveState();
  render();
});

// 年間収支計画表(index.html)の支出項目に「サブスク費」として金額を書き込む。
// 同名の項目が既にあれば金額のみ更新し、無ければ新規追加する。
function writeMonthlyTotalToAnnualBudget(monthlyTotal){
  let budget;
  try{
    const raw = localStorage.getItem(ANNUAL_KEY);
    budget = raw ? JSON.parse(raw) : null;
  }catch(e){ budget = null; }
  if(!budget || !Array.isArray(budget.income) || !Array.isArray(budget.expense)){
    budget = { year: new Date().getFullYear(), income: [], expense: [] };
  }

  const amount = Math.round(monthlyTotal);
  const existing = budget.expense.find(it => (it.name||'').trim() === WRITE_ITEM_NAME);
  let mode;
  if(existing){
    existing.amount = amount;
    if(!existing.count) existing.count = 12;
    mode = 'update';
  }else{
    budget.expense.push({ name: WRITE_ITEM_NAME, amount: amount, count: 12 });
    mode = 'add';
  }

  localStorage.setItem(ANNUAL_KEY, JSON.stringify(budget));
  return { mode, amount };
}

/* ---------- サマリー ---------- */
let currentMonthlyTotal = 0;

function renderTotals(){
  let monthlyTotal = 0, yearlyTotal = 0;
  state.items.forEach(item=>{
    monthlyTotal += monthlyEquivalent(item);
    yearlyTotal += yearlyEquivalent(item);
  });

  document.getElementById('sumMonthly').textContent = yen(monthlyTotal);
  document.getElementById('sumYearly').textContent = yen(yearlyTotal);
  document.getElementById('sumCount').textContent = state.items.length + '件';

  currentMonthlyTotal = monthlyTotal;
}

document.getElementById('writeToAnnualBtn').addEventListener('click', ()=>{
  if(currentMonthlyTotal <= 0){
    alert('書き込める金額がありません。先にサブスクを入力してください。');
    return;
  }
  const { mode, amount } = writeMonthlyTotalToAnnualBudget(currentMonthlyTotal);
  const msg = mode === 'update'
    ? `年間収支計画表の「サブスク費」を ${yen(amount)}/月 に更新しました`
    : `年間収支計画表に「サブスク費」(${yen(amount)}/月)を追加しました`;
  alert(msg);
});

function render(){
  renderItemList();
  renderTotals();
}

render();
</script>
</body>
</html>
